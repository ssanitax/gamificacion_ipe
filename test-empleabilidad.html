<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test · Itinerario para la empleabilidad II</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #5c6675;
    --line: #e4dccf;
    --paper: #f3efe6;
    --card: #fffdf8;
    --teal: #0e5f5c;
    --teal-dark: #0a4543;
    --amber: #c4652a;
    --ok: #1c6b45;
    --ok-bg: #e7f5ec;
    --bad: #9d2c22;
    --bad-bg: #fdeceb;
    --shadow: 0 16px 40px rgba(40, 32, 20, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(1200px 500px at 10% -10%, #efe4cf 0%, transparent 55%),
      var(--paper);
    font: 17px/1.45 "Segoe UI", system-ui, sans-serif;
  }

  .wrap {
    width: min(760px, calc(100% - 32px));
    margin: 0 auto;
    padding: 36px 0 64px;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    margin-bottom: 22px;
  }

  .kicker {
    margin: 0 0 6px;
    color: var(--teal);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
  }

  .sub {
    margin: 8px 0 0;
    color: var(--muted);
  }

  .progress-label {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    text-align: right;
    white-space: nowrap;
  }

  .bar {
    height: 8px;
    margin: 14px 0 22px;
    background: #e7e0d4;
    border-radius: 99px;
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--teal), #1a8a78);
    border-radius: inherit;
    transition: width 0.25s ease;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 28px 26px 22px;
  }

  .badge {
    display: inline-block;
    margin-bottom: 12px;
    padding: 4px 10px;
    border-radius: 99px;
    background: #e7f3f1;
    color: var(--teal-dark);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .question {
    margin: 0 0 18px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 3vw, 28px);
    line-height: 1.25;
  }

  .options { display: grid; gap: 10px; }

  .opt {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    width: 100%;
    padding: 12px 14px;
    text-align: left;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid #e6dfd3;
    border-radius: 12px;
    cursor: pointer;
    font: inherit;
  }

  .opt:hover { border-color: #b7cfcb; background: #f7fbfa; }

  .opt:focus-visible {
    outline: 3px solid #9fd0c8;
    outline-offset: 2px;
  }

  .opt.selected {
    border-color: var(--teal);
    background: #eef7f5;
    box-shadow: inset 0 0 0 1px var(--teal);
  }

  .letter {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #efeae1;
    color: var(--teal-dark);
    font-size: 13px;
    font-weight: 800;
  }

  .opt.selected .letter { background: var(--teal); color: white; }

  .opt.correct {
    border-color: var(--ok);
    background: var(--ok-bg);
    box-shadow: inset 0 0 0 1px var(--ok);
  }

  .opt.wrong {
    border-color: var(--bad);
    background: var(--bad-bg);
    box-shadow: inset 0 0 0 1px var(--bad);
  }

  .opt.correct .letter { background: var(--ok); color: white; }
  .opt.wrong .letter { background: var(--bad); color: white; }
  .opt.dim { opacity: 0.55; }
  .opt.locked { cursor: default; }
  .opt.locked:hover { border-color: inherit; background: inherit; }
  .opt.correct.locked:hover { border-color: var(--ok); background: var(--ok-bg); }
  .opt.wrong.locked:hover { border-color: var(--bad); background: var(--bad-bg); }
  .opt.dim.locked:hover { background: #fff; border-color: #e6dfd3; }

  .feedback {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 12px;
  }

  .feedback p { margin: 0; }
  .feedback strong { display: block; margin-bottom: 4px; }
  .feedback.good { background: var(--ok-bg); color: #145233; }
  .feedback.bad { background: var(--bad-bg); color: #7a241c; }

  .choice {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin: 4px 0 16px;
    padding: 14px;
    border: 1.5px solid #e6dfd3;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
  }

  .choice:has(input:checked) {
    border-color: var(--teal);
    background: #eef7f5;
  }

  .choice input {
    margin-top: 3px;
    accent-color: var(--teal);
    width: 18px;
    height: 18px;
  }

  .choice strong { display: block; }
  .choice span { color: var(--muted); font-size: 15px; }

  .nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
  }

  button.btn {
    border: 0;
    border-radius: 999px;
    padding: 12px 18px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  button.btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn.ghost {
    background: transparent;
    color: var(--muted);
  }

  .btn.primary {
    background: var(--teal);
    color: white;
  }

  .btn.primary:hover:not(:disabled) { background: var(--teal-dark); }

  .intro p { margin: 0 0 12px; color: #334; }

  .intro ul {
    margin: 0 0 18px;
    padding-left: 18px;
    color: #334;
  }

  .score-hero {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    margin-bottom: 8px;
  }

  .nota {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 84px;
    line-height: 0.85;
    letter-spacing: -0.04em;
    color: var(--teal-dark);
  }

  .nota span {
    font-size: 28px;
    color: var(--muted);
    letter-spacing: 0;
  }

  .verdict {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
  }

  .meta { margin: 0; color: var(--muted); }

  .split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 18px 0;
  }

  .pill {
    padding: 12px 14px;
    border-radius: 12px;
    background: #f6f3ec;
  }

  .pill strong { display: block; font-size: 20px; }
  .pill span { color: var(--muted); font-size: 13px; }

  .review { display: grid; gap: 10px; margin-top: 8px; }

  .item {
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
  }

  .item.good { background: var(--ok-bg); border-color: #c9e6d4; }
  .item.bad { background: var(--bad-bg); border-color: #f3cdc8; }

  .item p { margin: 6px 0 0; }
  .item .q { margin: 0; font-weight: 700; }
  .tag {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .item.good .tag { color: var(--ok); }
  .item.bad .tag { color: var(--bad); }

  .actions { margin-top: 18px; display: flex; justify-content: flex-end; }

  @media (max-width: 640px) {
    .nota { font-size: 64px; }
    .split { grid-template-columns: 1fr; }
    header.top {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .progress-label { text-align: left; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <p class="kicker">Itinerario personal para la empleabilidad II</p>
        <h1>Test de 20 preguntas</h1>
        <p class="sub">UD1. Búsqueda de empleo · UD2. Competencias personales y sociales</p>
      </div>
      <p class="progress-label" id="progressLabel"></p>
    </header>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <section class="card" id="app"></section>
  </main>

  <script>
    const LETTERS = ["A", "B", "C", "D"];

    const questions = [
      {
        unit: "UD1",
        q: "¿Qué es un itinerario académico y profesional?",
        options: [
          "El primer contrato que firma una empresa",
          "Una planificación personalizada y flexible del futuro formativo y laboral",
          "Una oposición al sector público",
          "Una red social para buscar trabajo"
        ],
        answer: 1
      },
      {
        unit: "UD1",
        q: "¿Cuál de estos es un objetivo del itinerario académico y profesional?",
        options: [
          "Evitar la formación complementaria",
          "Imitar exactamente lo que hacen los demás",
          "Conocer las salidas profesionales y formativas disponibles",
          "Decidir el empleo sin informarse"
        ],
        answer: 2
      },
      {
        unit: "UD1",
        q: "En el ejemplo de una persona interesada en la gestión y la oficina, ¿qué Grado Superior se cita?",
        options: [
          "Administración y Finanzas",
          "Dirección de Cocina",
          "Educación Infantil",
          "Guía, información y asistencias turísticas"
        ],
        answer: 0
      },
      {
        unit: "UD1",
        q: "¿Qué es la marca personal?",
        options: [
          "El anuncio de una oferta de trabajo",
          "El nombre comercial de una ETT",
          "Un boletín oficial, como el BOE",
          "La identidad profesional que proyectas, basada en competencias, valores y experiencias"
        ],
        answer: 3
      },
      {
        unit: "UD1",
        q: "¿Cuál de estas es una fuente directa de empleo?",
        options: [
          "Portales como InfoJobs o Indeed, donde hay ofertas concretas",
          "Una charla con un conocido en la que no hay ninguna vacante",
          "Una revista que solo comenta tendencias del sector",
          "Una asociación que informa, pero no publica ofertas"
        ],
        answer: 0
      },
      {
        unit: "UD1",
        q: "¿En qué consiste el networking?",
        options: [
          "Enviar currículums sin leer la oferta",
          "Construir relaciones profesionales con otras personas del sector",
          "Inventar experiencia en el currículum",
          "Hacer únicamente un test de personalidad"
        ],
        answer: 1
      },
      {
        unit: "UD1",
        q: "Para que el currículum supere los filtros automáticos (ATS), conviene:",
        options: [
          "Entregar siempre el mismo documento genérico",
          "Quitar las certificaciones y la formación",
          "Incluir palabras clave de la oferta y del sector",
          "No personalizar la carta de presentación"
        ],
        answer: 2
      },
      {
        unit: "UD1",
        q: "¿Qué es la autocandidatura?",
        options: [
          "Aprobar un examen tipo test",
          "Apuntarse solo en el SEPE y esperar",
          "Abrir un canal de vídeos",
          "Enviar el currículum por iniciativa propia y hacer un seguimiento"
        ],
        answer: 3
      },
      {
        unit: "UD1",
        q: "Una entrevista de trabajo estructurada se caracteriza por:",
        options: [
          "Preguntas predefinidas y un alto nivel de objetividad",
          "No llevar ninguna pregunta preparada",
          "Durar siempre uno o dos días completos",
          "Valorar solo el sentido del humor"
        ],
        answer: 0
      },
      {
        unit: "UD1",
        q: "¿Cómo se selecciona al personal en el sector público?",
        options: [
          "Según la moda de cada empresa",
          "Con convocatorias públicas, transparencia y mérito",
          "Con un mensaje privado por redes sociales",
          "Con la técnica Pomodoro"
        ],
        answer: 1
      },
      {
        unit: "UD2",
        q: "¿Qué son las competencias personales?",
        options: [
          "Las leyes que regulan las oposiciones",
          "Solo los programas informáticos del puesto",
          "Habilidades y cualidades internas para desenvolverse en el trabajo y en la vida",
          "Los contactos que se hacen en una feria de empleo"
        ],
        answer: 2
      },
      {
        unit: "UD2",
        q: "¿En qué consiste la asertividad?",
        options: [
          "Gritar para que te hagan caso",
          "No dar nunca tu opinión",
          "Copiar lo que dice el grupo",
          "Decir lo que piensas de forma clara y respetuosa, sin atacar a los demás"
        ],
        answer: 3
      },
      {
        unit: "UD2",
        q: "¿Qué es la empatía?",
        options: [
          "La capacidad de ponerse en el lugar de otra persona",
          "Hablar más que el resto del equipo",
          "Hacer varias tareas a la vez",
          "Dejar el trabajo para más tarde"
        ],
        answer: 0
      },
      {
        unit: "UD2",
        q: "¿Qué es la netiqueta?",
        options: [
          "Una técnica de entrevista",
          "Las normas de buena conducta al comunicarse en línea",
          "Un portal europeo de empleo",
          "Una matriz para ordenar tareas"
        ],
        answer: 1
      },
      {
        unit: "UD2",
        q: "¿Qué herramienta encaja mejor en trabajos en equipo porque funciona en la nube?",
        options: [
          "Prezi, pensada para presentaciones no lineales",
          "PowerPoint, el programa clásico de presentaciones",
          "Google Slides",
          "Canva, orientada a diseños rápidos con plantillas"
        ],
        answer: 2
      },
      {
        unit: "UD2",
        q: "La comunicación interna de un equipo es la que se mantiene:",
        options: [
          "Con clientes y proveedores",
          "Solo en redes sociales abiertas al público",
          "A través del BOE",
          "Entre las personas del mismo equipo o de la empresa"
        ],
        answer: 3
      },
      {
        unit: "UD2",
        q: "Según el tema, un conflicto conviene verlo como:",
        options: [
          "Una oportunidad para mejorar la comunicación y fortalecer el equipo",
          "Algo que hay que ignorar hasta que desaparezca",
          "Un motivo para dejar el trabajo",
          "La prueba de que el equipo ha fracasado"
        ],
        answer: 0
      },
      {
        unit: "UD2",
        q: "En la técnica Pomodoro, ¿cuánto dura cada bloque de trabajo?",
        options: [
          "10 minutos",
          "25 minutos",
          "45 minutos",
          "2 horas"
        ],
        answer: 1
      },
      {
        unit: "UD2",
        q: "La matriz de Eisenhower ordena las tareas según:",
        options: [
          "Si son divertidas o aburridas",
          "El sueldo y el horario",
          "Si son urgentes y si son importantes",
          "El número de compañeros del equipo"
        ],
        answer: 2
      },
      {
        unit: "UD2",
        q: "¿Qué dice la regla de los dos minutos?",
        options: [
          "Hay que descansar dos minutos cada hora",
          "Las reuniones deben durar como máximo dos minutos",
          "Solo se trabaja dos minutos al día",
          "Si una tarea lleva menos de dos minutos, se hace en el momento"
        ],
        answer: 3
      }
    ];

    const explanations = [
      "Un itinerario académico y profesional es una planificación personalizada y flexible. Sirve para decidir el futuro formativo y laboral alineando intereses, habilidades y objetivos con las oportunidades del mercado.",
      "Entre sus objetivos está conocer las salidas profesionales y formativas, identificar intereses y metas, y diseñar un camino a medio y largo plazo.",
      "En el ejemplo, con interés por la gestión y la oficina, el Grado Medio es Técnico en Gestión Administrativa y el Grado Superior es Administración y Finanzas.",
      "La marca personal es la identidad que proyectas en el ámbito profesional, a partir de tus competencias, valores, habilidades y experiencias.",
      "Las fuentes directas publican ofertas concretas a las que puedes enviar la candidatura. InfoJobs, Indeed, las webs de las empresas o LinkedIn son ejemplos.",
      "El networking consiste en construir relaciones profesionales con otras personas del sector. Muchas vacantes no se publican y se conocen por esos contactos.",
      "Para superar los filtros automáticos (ATS) hay que adaptar el currículum al sector e incluir palabras clave de la oferta. La carta también se personaliza para cada empresa.",
      "La autocandidatura es el envío proactivo del currículum. Conviene investigar la empresa, anotar cada envío y hacer un seguimiento respetuoso.",
      "En la entrevista estructurada las preguntas están definidas de antemano y la evaluación es más objetiva. La entrevista por competencias se fija en comportamientos a partir de experiencias reales.",
      "En el sector público el acceso se regula por normativa: convocatorias públicas, pruebas estandarizadas, transparencia y mérito. En el privado pesa más la flexibilidad y el encaje con la empresa.",
      "Las competencias personales son habilidades y cualidades internas. Determinan cómo te relacionas contigo mismo y te ayudan a desenvolverte en el trabajo y en la vida.",
      "La asertividad es expresar lo que piensas o sientes de forma clara y respetuosa, defendiendo tus derechos sin atacar a los demás.",
      "La empatía es la capacidad de ponerte en el lugar de otra persona para entender cómo se siente y por qué actúa de esa manera.",
      "La netiqueta es el conjunto de normas de buena conducta para comunicarte en línea, ya sea por correo, en un chat de trabajo o en redes sociales.",
      "Google Slides funciona en la nube y está pensada para trabajos en equipo. PowerPoint es el programa clásico, Prezi un lienzo no lineal, Canva usa plantillas y Genially crea contenido interactivo.",
      "La comunicación interna es la que mantienen las personas del mismo equipo o empresa, por ejemplo en reuniones, correos o chats. La externa es la que se tiene con clientes, proveedores o el público.",
      "Un conflicto no conviene ignorarlo. Es una oportunidad para mejorar la comunicación, encontrar soluciones y fortalecer el equipo.",
      "En la técnica Pomodoro se trabaja 25 minutos sin interrupciones, se descansa 5 y, cada cuatro bloques, se hace una pausa más larga de 15 a 30 minutos.",
      "La matriz de Eisenhower clasifica las tareas con dos preguntas: ¿es urgente? y ¿es importante? Así se prioriza lo que de verdad aporta valor.",
      "Si una tarea lleva menos de dos minutos, la regla dice que se haga en el momento. Así no se acumulan pendientes pequeños."
    ];

    const state = {
      screen: "intro",
      index: 0,
      showResolution: false,
      answers: Array(questions.length).fill(null)
    };

    const app = document.getElementById("app");
    const bar = document.getElementById("bar");
    const progressLabel = document.getElementById("progressLabel");

    function verdict(nota) {
      if (nota >= 9) return "Sobresaliente";
      if (nota >= 7) return "Notable";
      if (nota >= 5) return "Aprobado";
      return "Suspenso";
    }

    function formatNota(aciertos) {
      const nota = aciertos / 2;
      return Number.isInteger(nota) ? String(nota) : nota.toFixed(1).replace(".", ",");
    }

    function count(unit) {
      return questions.reduce((sum, item, i) => {
        if (unit && item.unit !== unit) return sum;
        return sum + (state.answers[i] === item.answer ? 1 : 0);
      }, 0);
    }

    function render() {
      if (state.screen === "intro") {
        progressLabel.textContent = "20 preguntas";
        bar.style.width = "0%";
        app.innerHTML = `
          <div class="intro">
            <p>Responde las 20 preguntas tipo test. Hay una sola respuesta correcta en cada una.</p>
            <ul>
              <li>10 preguntas de la búsqueda de empleo.</li>
              <li>10 preguntas de competencias personales y sociales.</li>
            </ul>
            <p>Al terminar verás la nota sobre 10, los aciertos y qué preguntas has fallado.</p>
            <label class="choice">
              <input type="checkbox" id="reveal" ${state.showResolution ? "checked" : ""}>
              <span><strong>Ver la resolución al responder</strong>Al elegir una opción verás si es correcta y por qué, antes de pasar a la siguiente.</span>
            </label>
          </div>
          <div class="actions"><button class="btn primary" id="start">Empezar</button></div>
        `;
        document.getElementById("start").onclick = () => {
          state.showResolution = document.getElementById("reveal").checked;
          state.screen = "quiz";
          state.index = 0;
          render();
        };
        return;
      }

      if (state.screen === "result") {
        const aciertos = count();
        const nota = aciertos / 2;
        const ud1 = count("UD1");
        const ud2 = count("UD2");
        progressLabel.textContent = "Resultado";
        bar.style.width = "100%";
        const review = questions.map((item, i) => {
          const ok = state.answers[i] === item.answer;
          const chosen = state.answers[i];
          const yours = chosen == null ? "Sin respuesta" : `${LETTERS[chosen]}) ${item.options[chosen]}`;
          const right = `${LETTERS[item.answer]}) ${item.options[item.answer]}`;
          return `
            <article class="item ${ok ? "good" : "bad"}">
              <div class="tag">${ok ? "Acierto" : "Fallo"} · ${item.unit} · ${i + 1}</div>
              <p class="q">${item.q}</p>
              <p>${ok ? `Respuesta: ${right}` : `Tu respuesta: ${yours}<br>Correcta: ${right}`}</p>
            </article>
          `;
        }).join("");

        app.innerHTML = `
          <p class="kicker">Tu nota</p>
          <div class="score-hero">
            <p class="nota">${formatNota(aciertos)}<span> / 10</span></p>
            <div>
              <p class="verdict">${verdict(nota)}</p>
              <p class="meta">${aciertos} aciertos de ${questions.length}</p>
            </div>
          </div>
          <div class="split">
            <div class="pill"><strong>${ud1} / 10</strong><span>UD1. Búsqueda de empleo</span></div>
            <div class="pill"><strong>${ud2} / 10</strong><span>UD2. Competencias personales y sociales</span></div>
          </div>
          <h2 style="font-size:18px;margin:8px 0 12px">Revisión</h2>
          <div class="review">${review}</div>
          <div class="actions"><button class="btn primary" id="retry">Repetir el test</button></div>
        `;
        document.getElementById("retry").onclick = () => {
          state.screen = "intro";
          state.index = 0;
          state.answers = Array(questions.length).fill(null);
          render();
        };
        return;
      }

      const item = questions[state.index];
      const chosen = state.answers[state.index];
      const revealed = state.showResolution && chosen != null;
      const correct = chosen === item.answer;
      progressLabel.textContent = `Pregunta ${state.index + 1} de ${questions.length}`;
      bar.style.width = `${(state.index / questions.length) * 100}%`;

      app.innerHTML = `
        <div class="badge">${item.unit === "UD1" ? "UD1 · Búsqueda de empleo" : "UD2 · Competencias"}</div>
        <h2 class="question">${item.q}</h2>
        <div class="options">
          ${item.options.map((text, i) => {
            let cls = "opt";
            if (revealed) {
              cls += " locked";
              if (i === item.answer) cls += " correct";
              else if (i === chosen) cls += " wrong";
              else cls += " dim";
            } else if (chosen === i) {
              cls += " selected";
            }
            return `
            <button class="${cls}" data-i="${i}" type="button">
              <span class="letter">${LETTERS[i]}</span>
              <span>${text}</span>
            </button>`;
          }).join("")}
        </div>
        ${revealed ? `
          <div class="feedback ${correct ? "good" : "bad"}">
            <strong>${correct ? "Correcta" : "Incorrecta. La respuesta es la " + LETTERS[item.answer] + "."}</strong>
            <p>${explanations[state.index]}</p>
          </div>
        ` : ""}
        <div class="nav">
          <button class="btn ghost" id="prev" type="button" ${state.index === 0 ? "disabled" : ""}>Anterior</button>
          <button class="btn primary" id="next" type="button" ${chosen == null ? "disabled" : ""}>
            ${state.index === questions.length - 1 ? "Ver mi nota" : "Siguiente"}
          </button>
        </div>
      `;

      app.querySelectorAll(".opt").forEach((btn) => {
        btn.onclick = () => {
          if (state.showResolution && state.answers[state.index] != null) return;
          state.answers[state.index] = Number(btn.dataset.i);
          render();
        };
      });

      document.getElementById("prev").onclick = () => {
        if (state.index > 0) {
          state.index -= 1;
          render();
        }
      };

      document.getElementById("next").onclick = () => {
        if (state.answers[state.index] == null) return;
        if (state.index === questions.length - 1) {
          state.screen = "result";
        } else {
          state.index += 1;
        }
        render();
      };
    }

    render();
  </script>
</body>
</html>
